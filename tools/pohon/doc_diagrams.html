<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Diagram dokumen</title>
<style>
:root{--ink:#16211B;--muted:#5B655F;--line:#C9CFCB;--pale:#F2F4F2;--b0:#DCE6F3;--b1:#AFC6E6;--b2:#7CA2D6;--b3:#3F72B8;--b4:#1D4F91;--acc:#AE3F57;
--p1:#AE3F57;--p2:#9E5F12;--p3:#2F7A43;--p4:#2A63A3;--p5:#6C4CA0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;padding:20px}
figure.d{width:760px;background:#fff;padding:14px 10px;margin-bottom:40px;font-size:12px;line-height:1.35}
.row{display:flex;gap:10px;align-items:stretch}
.card{border:1px solid var(--line);background:var(--pale);border-radius:8px;padding:9px 11px}
.card.w{background:#fff;border-color:var(--b3)}
.card.dk{background:var(--b4);border-color:var(--b4);color:#fff}
.t{font-weight:650;font-size:12.5px}
.s{color:var(--muted);font-size:11px;margin-top:3px}
.dk .s{color:#DCE6F3}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--b4);color:#fff;font-weight:700;font-size:12px;align-items:center;justify-content:center;margin-right:7px;flex:none}
.arr{display:flex;align-items:center;justify-content:center;color:var(--b3);font-size:18px;flex:none}
.down{text-align:center;color:var(--muted);font-size:15px;line-height:18px;height:18px}
.lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
/* staircase */
.stairs{display:flex;align-items:flex-end;gap:6px;height:230px}
.step{flex:1;border-radius:6px 6px 0 0;padding:9px 10px;background:var(--b0)}
.step.dk{background:var(--b4);color:#fff}
.step .n{font-size:22px;font-weight:750;line-height:1}
.step .t{margin-top:5px}
.step .s{font-size:10.5px}
.step.dk .s{color:#DCE6F3}
.brk{display:flex;gap:6px;margin-top:6px}
.brk div{border-top:2px solid var(--ink);padding-top:4px;font-size:11px;text-align:center}
.brk .a{border-color:var(--acc);color:var(--acc)}
/* loop */
.loop{position:relative;padding-bottom:34px}
.loop .back{position:absolute;left:40px;right:40px;bottom:6px;height:26px;border:2px solid var(--b3);border-top:none;border-radius:0 0 14px 14px}
.loop .back:before{content:"";position:absolute;left:-7px;top:-9px;border:6px solid transparent;border-bottom:9px solid var(--b3)}
.loop .bl{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;padding:0 8px;font-size:11px;color:var(--b4);font-weight:600}
.loop .card{flex:1}
/* chevrons */
.chev{display:flex;gap:4px}
.chev div{flex:1;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%);padding:10px 20px 10px 26px;color:#fff}
.chev div:first-child{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%);padding-left:12px}
.phase{display:flex;gap:10px;margin-top:8px}
.phase>div{flex:1}
.hl{color:var(--b4);font-weight:600}
.warn{border:1.5px solid var(--acc);background:#fff;border-radius:8px;padding:9px 11px}
.grid5{display:grid;grid-template-columns:repeat(5,14px);gap:3px}
.grid5 i{display:block;width:14px;height:14px;background:var(--b0);border-radius:2px}
.grid5 i.on{background:var(--acc)}
.axis{flex:1;border-radius:8px;padding:12px;border-top:5px solid var(--b4);background:var(--pale)}
.axis .big{font-size:20px;font-weight:750;color:var(--b4)}
.axis ul{margin:6px 0 0 16px;font-size:11.5px}
.axis li{margin:2px 0}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:600;color:#fff;margin:1px 2px 1px 0}
</style></head><body>

<!-- three axes -->
<figure class="d" id="d_tigasumbu">
  <div class="row">
    <div class="axis"><div class="lab">Sumbu 1 · cabang</div><div class="big">5 pilar</div><div class="t">masalah kesehatan yang diselesaikan</div>
      <div style="margin-top:6px"><span class="pill" style="background:var(--p1)">P1 PTM</span><span class="pill" style="background:var(--p2)">P2 Ibu &amp; anak</span><span class="pill" style="background:var(--p3)">P3 Infeksi</span><span class="pill" style="background:var(--p4)">P4 Trauma</span><span class="pill" style="background:var(--p5)">P5 Sistem</span></div>
      <ul><li>21 topik, kode 1.1–5.4</li><li>dibaca Prodi Sarjana Kedokteran dan Profesi Dokter</li><li>ukuran: luaran per topik</li></ul></div>
    <div class="axis"><div class="lab">Sumbu 2 · akar</div><div class="big">5 platform</div><div class="t">bidang teknologi yang dimatangkan</div>
      <div style="margin-top:6px;font-size:11px">T1 Biosinyal · T2 Biosensor · T3 AI &amp; citra · T4 Biomaterial · T5 Telematika</div>
      <ul><li>pertanyaan keilmuan per platform</li><li>dibaca Prodi Teknologi Kedokteran</li><li>ukuran: TKT per produk dan versi</li></ul></div>
    <div class="axis"><div class="lab">Sumbu 3 · tanah</div><div class="big">5 wahana</div><div class="t">tempat hasil diuji</div>
      <div style="margin-top:6px;font-size:11px">W0–W1 laboratorium · W2 klinik kampus · W3 RSUD pendidikan · W4 Desa Binaan</div>
      <ul><li>berpindah W0 → W4 = bukti translasi</li><li>kembali ke laboratorium tetap sah</li><li>ukuran: wahana kini dan target</li></ul></div>
  </div>
  <div class="card" style="margin-top:10px;text-align:center"><b>Setiap proyek punya satu koordinat utama (pilar, platform)</b> dan satu wahana. Integrasi lintas prodi terjadi di sel matriks, bukan di bagan organisasi.</div>
</figure>

<figure class="d" id="d_rantai">

    <div class="arr">→</div>
    <div class="card" style="flex:1"><div class="t">Renstra FKK 2026–2030</div><div class="s">visi integrasi kedokteran dan teknologi</div></div>

    <div class="card dk" style="flex:1.3"><div class="t">Rencana Induk Penelitian &amp; PkM FKK 2026–2030</div><div class="s">pohon penelitian dan peta jalan — dokumen ini</div></div>

    <div class="card w" style="flex:1"><div class="t">Renstra &amp; RIP Prodi Pendidikan Profesi Dokter</div></div>
    <div class="card w" style="flex:1"><div class="t">Renstra &amp; RIP Prodi Teknologi Kedokteran</div></div>

</figure>

<!-- surveillance platform -->
<figure class="d" id="d_surveilans">
